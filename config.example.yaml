# Mihomo 配置示例
# 完整配置文档: https://wiki.metacubex.one/

# 端口配置
mixed-port: 7890           # HTTP(S) 和 SOCKS5 混合代理端口
allow-lan: true            # 允许局域网连接
bind-address: "*"          # 绑定地址

# 运行模式
mode: rule                 # rule / global / direct

# 日志级别
log-level: info            # silent / error / warning / info / debug

# 外部控制器 (管理 API)
# 由环境变量自动配置，也可手动设置
# external-controller: '0.0.0.0:9090'
# secret: 'your_password'
# external-ui: '/root/.config/mihomo/ui'

# DNS 配置
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 1.1.1.1
  fallback-filter:
    geoip: true
    geoip-code: CN

# 代理服务器配置
proxies:
  # SS 示例
  # - name: "ss-server"
  #   type: ss
  #   server: server.example.com
  #   port: 443
  #   cipher: aes-256-gcm
  #   password: "password"

  # VMess 示例
  # - name: "vmess-server"
  #   type: vmess
  #   server: server.example.com
  #   port: 443
  #   uuid: uuid-here
  #   alterId: 0
  #   cipher: auto

  # Trojan 示例
  # - name: "trojan-server"
  #   type: trojan
  #   server: server.example.com
  #   port: 443
  #   password: password
  #   sni: server.example.com

# 代理提供者 (订阅)
# proxy-providers:
#   provider1:
#     type: http
#     url: "https://your-subscription-url"
#     path: ./providers/provider1.yaml
#     interval: 3600
#     health-check:
#       enable: true
#       url: http://www.gstatic.com/generate_204
#       interval: 300

# 代理组
proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - DIRECT
      # 添加你的代理服务器名称

  - name: "AUTO"
    type: url-test
    proxies:
      - DIRECT
    url: http://www.gstatic.com/generate_204
    interval: 300

# 规则
rules:
  # 本地/局域网直连
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT

  # 中国域名直连
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  # 默认走代理
  - MATCH,PROXY
